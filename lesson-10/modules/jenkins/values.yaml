controller:
  admin:
    username: admin
    password: admin123

  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  persistentVolume:
    enabled: true
    storageClass: "ebs-sc"
    size: 8Gi

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest
    - docker-plugin:latest
    - docker-workflow:latest
    - job-dsl:latest

  serviceAccount:
    name: jenkins-sa
    create: false

  JCasC:
    configScripts:
      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default.svc"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins:8080"
                containerCap: 10

      global-node-properties: |
        jenkins:
          globalNodeProperties:
          - envVars:
              env:
              - key: "ECR_URL"
                value: "${ecr_url}"

      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: github-token
                      username: ${github_user}
                      password: ${github_pat} 
                      description: GitHub PAT
      seed-job: |
        jobs:
          - script: >
              job('seed-job') {
                description('Job to generate pipeline for Django project')
                scm {
                  git {
                    remote {
                      url('${github_repo_url}')
                      credentials('github-token')
                    }
                    branches('*/lesson-10')
                  }
                }
                steps {
                  dsl {
                    text('''
                      pipelineJob("goit-django-docker") {
                        properties {
                          githubProjectUrl("${github_repo_url}")
                        }
                        triggers {
                          githubPush()
                        }
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("${github_repo_url}")
                                  credentials("github-token")
                                }
                                branches("*/lesson-10")
                                extensions {
                                  userExclusion {
                                    excludedUsers('Jenkins CI')
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    ''')
                  }
                }
              }

      github-server-config: |
        unclassified:
          githubpluginconfig:
            configs:
            - name: "GitHub"
              apiUrl: "https://api.github.com"
              manageHooks: true
              credentialsId: "github-token"
